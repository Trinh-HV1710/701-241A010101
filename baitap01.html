<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Thực Hành 1 - Danh Sách Sản Phẩm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">Mã SV: 241A010101</div>
        <div class="menu-links">
            <a href="index.html">Trang chủ</a>
            <a href="baitap01.html" class="active">BT1: Sản phẩm</a>
            <a href="baitap02.html">BT2: Đăng ký</a>
            <a href="baitap03.html">BT3: Countdown</a>
        </div>
    </nav>

    <header style="padding: 2rem;">
        <h1>TÌM KIẾM SẢN PHẨM THÔNG MINH</h1>
        <p>Hiển thị danh sách sản phẩm từ mảng JavaScript sử dụng Flexbox/Grid</p>
    </header>

    <section class="content-box" style="max-width: 900px;">
        <div style="margin-bottom: 20px;">
            <input type="text" id="search-input" placeholder="Nhập tên sản phẩm cần tìm..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px;">
        </div>

        <div id="product-grid" class="grid-container">
            <!-- Sản phẩm sẽ được render bằng JavaScript -->
        </div>
        <p id="error-msg" style="color: #ef4444; font-weight: bold; text-align: center; display: none; margin-top: 20px;">Không tìm thấy sản phẩm phù hợp!</p>
    </section>

    <footer>
        <p>&copy; Huỳnh Việt Trinh - 241A010101</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Laptop Gaming ASUS ROG", price: "25.000.000đ", img: "images/avatar1.jpg" },
            { id: 2, name: "Điện thoại iPhone 15 Pro", price: "22.000.000đ", img: "images/avatar2.jpg" },
            { id: 3, name: "Tai nghe Bluetooth Sony", price: "2.500.000đ", img: "images/avatar3.jpg" },
            { id: 4, name: "Bàn phím cơ Keychron K2", price: "1.800.000đ", img: "images/avatar4.jpg" },
            { id: 5, name: "Chuột không dây Logitech", price: "850.000đ", img: "images/avatar5.jpg" }
        ];

        const searchInput = document.getElementById('search-input');
        const productGrid = document.getElementById('product-grid');
        const errorMsg = document.getElementById('error-msg');

        function renderProducts(list) {
            productGrid.innerHTML = '';
            if (list.length === 0) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            list.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <p style="color: #38bdf8; font-weight: bold; margin: 10px 0;">${p.price}</p>
                    <button style="background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;">Mua ngay</button>
                `;
                productGrid.appendChild(card);
            });
        }

        renderProducts(products);

        // Logic xử lý tìm kiếm an toàn (tránh XSS/Injection bằng cách dùng textContent thay innerHTML trực tiếp cho input)
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = products.filter(p => p.name.toLowerCase().includes(keyword));
            renderProducts(filtered);
        });
    </script>
</body>
</html>
