<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Thực Hành 3 - Countdown Timer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">Mã SV: 241A010101</div>
        <div class="menu-links">
            <a href="index.html">Trang chủ</a>
            <a href="baitap01.html">BT1: Sản phẩm</a>
            <a href="baitap02.html">BT2: Đăng ký</a>
            <a href="baitap03.html" class="active">BT3: Countdown</a>
        </div>
    </nav>

    <header style="padding: 2rem;">
        <h1>ĐỒNG HỒ ĐẾM NGƯỢC (COUNTDOWN TIMER)</h1>
        <p>Thời gian làm bài: 10 phút - Hiệu ứng cảnh báo khi dưới 1 phút</p>
    </header>

    <section class="content-box" style="text-align: center; max-width: 500px;">
        <div id="timer-display" style="font-size: 64px; font-weight: bold; color: #38bdf8; margin: 20px 0;">10:00</div>
        <button id="start-timer" style="background: #3b82f6; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer;">Bắt đầu đếm ngược</button>
    </section>

    <!-- Modal Modal thông báo hết giờ -->
    <div id="timeup-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
        <div style="background:#1e293b; padding:30px; border-radius:12px; text-align:center; border:1px solid #38bdf8;">
            <h2 style="color:#ef4444; margin-bottom:15px;">HẾT GIỜ! ⏰</h2>
            <p>Thời gian làm bài đã kết thúc.</p>
            <button onclick="location.reload()" style="margin-top:15px; background:#38bdf8; color:#0f172a; border:none; padding:8px 16px; font-weight:bold; border-radius:6px; cursor:pointer;">Làm lại</button>
        </div>
    </div>

    <footer>
        <p>&copy; Huỳnh Việt Trinh - 241A010101</p>
    </footer>

    <script>
        let totalSeconds = 10 * 60; // 10 phút
        let timerInterval = null;
        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-timer');
        const modal = document.getElementById('timeup-modal');

        function updateTimer() {
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = totalSeconds % 60;

            display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // Khi thời gian dưới 1 phút (60 giây), thêm hiệu ứng nhấp nháy cảnh báo
            if (totalSeconds <= 60) {
                display.classList.add('blink-warning');
            }

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                modal.style.display = 'flex';
            } else {
                totalSeconds--;
            }
        }

        startBtn.addEventListener('click', () => {
            if (timerInterval) return;
            startBtn.disabled = true;
            timerInterval = setInterval(updateTimer, 1000);
        });
    </script>
</body>
</html>
